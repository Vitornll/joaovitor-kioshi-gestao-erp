name: CI (validação rápida do app web)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependências
        working-directory: apps/web
        run: npm install
      - name: Checagem de tipos (TypeScript)
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build (web)
        working-directory: apps/web
        run: npm run build:web
      - name: Upload build web (preview)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/web
          retention-days: 14
